<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px system-ui;
        width: 280px;
        padding: 15px;
        color: #17212f;
      }

      h2 {
        font-size: 17px;
        margin: 0 0 12px;
      }

      button {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button.secondary {
        background: #475569;
      }

      .option {
        display: block;
        margin: 10px 0;
      }

      .hint {
        font-size: 12px;
        color: #64748b;
      }

      .progress-wrap { margin: 14px 0 8px; }
      .progress-heading { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; margin-bottom: 7px; }
      .progress-track { height: 10px; overflow: hidden; background: #e2e8f0; border-radius: 999px; }
      .progress-fill { height: 100%; width: 0%; background: #2563eb; border-radius: inherit; transition: width 180ms ease; }
      .progress-wrap[data-phase="Complete"] .progress-fill { background: #16a34a; }
      .progress-wrap[data-phase="Error"] .progress-fill { background: #dc2626; }
      #status {
        font-size: 12px;
        color: #475569;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <h2>Smart Long Screenshot</h2>

    <button id="auto">Capture Scrollable Content</button>
    <div class="hint">Capture once, then export PNG or smart-split A4 PDF from Preview.</div>

    <button id="stop" class="secondary">Stop Capture</button>

    <div class="progress-wrap" id="progressWrap" role="progressbar" aria-label="Screenshot progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-heading"><span id="progressPhase">Ready</span><span id="progressPercent">0%</span></div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    </div>
    <div id="status">Open a webpage to begin.</div>

    <script src="popup.js"></script>
  </body>
</html>
