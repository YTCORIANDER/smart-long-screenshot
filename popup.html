<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px system-ui;
        width: 280px;
        padding: 15px;
        color: #17212f;
      }

      h2 {
        font-size: 17px;
        margin: 0 0 12px;
      }

      button {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button.secondary {
        background: #475569;
      }

      .option {
        display: block;
        margin: 10px 0;
      }

      .hint {
        font-size: 12px;
        color: #64748b;
      }

      #status {
        font-size: 12px;
        color: #475569;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <h2>Smart Long Screenshot</h2>

    <label class="option">
      <input type="checkbox" id="pdf" />
      Export PDF with smart page splitting (A4)
    </label>

    <button id="auto">Capture Scrollable Content</button>
    <button id="page" class="secondary">Capture Main Page</button>

    <div class="hint">PNG by default; check PDF for smart page splitting.</div>

    <button id="stop" class="secondary">Stop Capture</button>

    <div id="status">Open a webpage to begin.</div>

    <script src="popup.js"></script>
  </body>
</html>
