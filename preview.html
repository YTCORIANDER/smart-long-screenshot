<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Long Screenshot — Preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#101827;color:#e8eef8}header{position:sticky;top:0;z-index:5;background:#172238;border-bottom:1px solid #36465e;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0 14px 0 0}button{border:1px solid #425570;background:#273650;color:#fff;padding:9px 14px;border-radius:8px;cursor:pointer}button:hover{background:#35496b}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#2563eb;border-color:#2563eb}#zoomLabel{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}#status{color:#aebed5;margin-left:auto}#workspace{padding:24px;overflow:auto;text-align:center;min-height:70vh}#image{display:none;margin:auto;max-width:none;height:auto;box-shadow:0 10px 40px #0009;background:white}#pdf{display:none;border:0;background:white;margin:0 auto;width:100%;height:calc(100vh - 112px);min-height:650px}#hint{padding:18px;color:#aebed5}#error{color:#ffb4b4}input[type=range]{width:125px;accent-color:#60a5fa} @media(max-width:700px){header{padding:10px}#workspace{padding:8px}#status{width:100%;margin:0}}
</style></head><body>
<header><h1>Screenshot Preview</h1><button id="minus" aria-label="Zoom out">−</button><input id="slider" type="range" min="10" max="300" value="100" step="5" aria-label="Zoom"><button id="plus" aria-label="Zoom in">+</button><span id="zoomLabel">100%</span><button id="fit">Fit width</button><button id="actual">100%</button><button id="exportPng" class="primary" disabled>Export PNG</button><button id="exportPdf" class="primary" disabled>Export PDF (A4)</button><span id="status">Loading capture…</span></header>
<div id="workspace" title="Pinch with a trackpad to zoom"><img id="image" alt="Full-length screenshot preview"><iframe id="pdf" title="PDF preview"></iframe><div id="hint">Loading preview…</div><div id="error" role="alert"></div></div>
<script src="preview.js"></script></body></html>
